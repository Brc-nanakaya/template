AWSTemplateFormatVersion: "2010-09-09"
Description: >
  法令 RAG 用の東京リージョン土台（S3 + アプリ用 IAM）。
  デモと本番はスタックを分ける（Environment パラメータ）。

Parameters:
  ProjectName:
    Type: String
    Default: brc-rag
  Environment:
    Type: String
    AllowedValues: [demo, prod]
    Default: demo

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: app
          Value: rag
        - Key: env
          Value: !Ref Environment

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-app"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: rag-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentsBucket.Arn
                  - !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                Resource: "*"

Outputs:
  Region:
    Value: !Ref AWS::Region
  BucketName:
    Value: !Ref DocumentsBucket
  AppRoleArn:
    Value: !GetAtt AppRole.Arn
  AppEnv:
    Value: !Ref Environment
